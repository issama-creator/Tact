# lib/l10n/l10n.yaml
#
# Flutter localization codegen config. Consumed by `flutter gen-l10n`, which
# is triggered automatically by `flutter pub get` when `generate: true` is
# set in pubspec.yaml.

arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppL10n
nullable-getter: false
