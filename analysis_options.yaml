include: package:flutter_lints/flutter.yaml

# TACT lint config.
#
# Architectural boundaries in TACT are enforced by folder discipline
# (see docs/ARCHITECTURE.md). The following folders are PURE DART and
# MUST NOT import package:flutter or platform plugins:
#
#   lib/keyboard/state/
#   lib/keyboard/panel/
#   lib/keyboard/rules/
#   lib/keyboard/engines/
#   lib/keyboard/input/
#   lib/keyboard/dictionaries/
#   lib/keyboard/actions/
#
# When we add `custom_lint` (post-MVP) we will encode this rule.
# Until then: enforce it in code review.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true
    avoid_print: true
    unawaited_futures: true
    unnecessary_late: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
